# .github/workflows/sync-awesome.yml
# 作用：每次 GitHub Release 发布后，自动开 PR 去 awesome-dsh-plugin 更新你条目的 tarball 行。
# 前提（需手动一步）：仓库 Settings → Secrets → Actions 添加 AWESOME_SYNC_TOKEN
#   （一条 public_repo 权限的个人访问令牌 PAT）。不添加则不运行，无副作用。
name: sync-awesome

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  open-pr:
    runs-on: ubuntu-latest
    if: ${{ secrets.AWESOME_SYNC_TOKEN != '' }}
    env:
      GH_TOKEN: ${{ secrets.AWESOME_SYNC_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: 开 PR 更新 awesome 条目
        run: |
          set -e
          VER="${{ github.event.release.tag_name }}"
          NOV="${VER#v}"
          TGZ="https://github.com/asfre/dsh-mcp-global-manager/releases/download/${VER}/dsh-mcp-global-manager-${NOV}.tgz"
          gh auth setup-git
          gh repo fork awesome-dsh-plugin --clone=false || true
          rm -rf awesome-fork
          git clone "https://x-access-token:${GH_TOKEN}@github.com/asfre/awesome-dsh-plugin" awesome-fork
          cd awesome-fork
          git checkout -b "sync-${VER}"
          F="data/plugins/asfre__dsh-mcp-global-manager.yml"
          if grep -q "^tarball:" "$F"; then
            sed -i "s#^tarball:.*#tarball: ${TGZ}#" "$F"
          else
            printf 'tarball: %s\n' "$TGZ" >> "$F"
          fi
          git add "$F"
          git commit -m "sync: update asfre/dsh-mcp-global-manager tarball ${VER}"
          git push -u origin "sync-${VER}"
          gh pr create \
            --repo awesome-dsh-plugin/awesome-dsh-plugin \
            --head "asfre:sync-${VER}" --base main \
            --title "Update asfre/dsh-mcp-global-manager tarball ${VER}" \
            --body "Auto-synced tarball for ${VER} (prebuilt install)."
